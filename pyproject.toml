[project]
name = "sunset-gc"
version = "0.1.0"
description = "Evidence-driven garbage collection for expired code rationale"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sunset = "sunset.cli:entrypoint"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sunset"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]

