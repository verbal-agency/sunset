[project]
name = "sunset-gc"
version = "0.1.0"
description = "Evidence-driven garbage collection for expired code rationale"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["code-maintenance", "git", "pytest", "static-analysis", "technical-debt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "langgraph>=1.2.11",
]

[project.scripts]
sunset = "sunset.cli:entrypoint"

[project.urls]
Repository = "https://github.com/verbal-agency/sunset"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sunset"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
